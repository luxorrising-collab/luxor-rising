contrastEyebrow: Why most people leave Egypt disappointed
contrastTitle: You came for the wonder. Not for a queue.
contrastLead: >-
  Most visitors meet Luxor through a packed coach, twenty rushed minutes per
  temple, the midday heat, and a guide they share with forty strangers. The real
  Egypt — the quiet, the colour, the awe — passes them by. And here is the part
  nobody says out loud: you flew four thousand kilometres to a place that has
  stood for three and a half thousand years, and you will probably stand here
  once. That is the whole argument for doing it properly.
badWayItems:
  - A coach with 40 strangers, on someone else's clock
  - Temples at midday, shoulder to shoulder
  - Hours lost to planning, booking, haggling
  - A generic script, rushed and impersonal
  - You hope it's good. You find out on the day.
goodWayItems:
  - '05:40 — a private car at your door, while it is still dark'
  - '06:15 — inside the first tomb, ninety minutes before the coaches'
  - Three places, unhurried — not seven, ticked off
  - Your licensed Egyptologist, named and briefed before you land
  - One consigliere who owns the whole day — and a refund if the first two hours
    don't feel different
mechanismEyebrow: Why we can actually do this
mechanismTitle: The whole difference is ninety minutes — and knowing which gate.
mechanismText: >-
  The Valley of the Kings opens at 6:00. The first coaches off the Hurghada road
  park at about 8:40. We collect you at 5:40, use the side gate rather than the
  main tourist entrance, and have your tickets in hand before we arrive — so you
  are through and standing inside the first tomb around 6:15. Two hours later,
  when the car parks fill, you are already having a long breakfast somewhere
  else. That is not a perk we added to justify the price. It is the price.
mechanismNote: >-
  It only works because the people on the ground are ours: Ahmed has been
  arranging private days in Luxor for [[POČET]] years, the drivers are vetted,
  and the guards at the gates know us by name.
dayShapeEyebrow: The shape of it
dayShapeTitle: One day, three places, and six hours you are not asked for anything.
dayShapeSteps:
  - time: '05:40'
    label: A private car at your door. Nobody speaks much yet.
  - time: '06:15'
    label: Through the gate and into the first tomb — empty.
  - time: '08:30'
    label: Hatshepsut as the light turns from grey to gold.
  - time: '10:00'
    label: Back for a long breakfast. The coaches arrive without you.
  - time: '16:30'
    label: Medinet Habu in the low sun, painted ceilings, nobody there.
  - time: '18:10'
    label: A felucca on the Nile, because the river is best last.
dayShapeNote: >-
  Three places in a day, not seven. You will be offered fewer things than anyone
  else in Luxor will offer you — that is the product. The empty hours in the
  middle are not a gap in the itinerary. They are what you are paying for.
dreamText: >-
  You wake before the heat. A private car is already waiting. At Karnak, the
  great hall is almost empty — your Egyptologist unfolds three thousand years as
  the first light moves between the columns. Lunch is handled. By late afternoon
  the Nile is yours alone, a felucca tilting into the gold. You took no
  decisions, stood in no queue, missed nothing. You simply arrived — and Egypt
  did the rest.
