thresholdEyebrow: If you're standing at a threshold
thresholdTitle: Some people come for Egypt. Some come for the pause before what's next.
thresholdText: >-
  We arrange a lot of these days for people between two chapters — a company
  sold, a decision not yet made, a birthday that landed harder than expected. We
  don't promise anything about that. A day can't fix a life. What it can do is
  give you an early hour in a place built three thousand years ago by people who
  were also trying to make something last, no schedule to keep, and someone
  beside you who knows when not to talk. Most of the value is in the silence we
  deliberately leave in the middle of the day.
multiDayEyebrow: If one day isn't the question
multiDayTitle: Some people aren't booking a day. They're booking a week to decide something.
multiDayText: >-
  The Return is seven days, written for one person, and we don't publish the
  itinerary because there isn't one until we've spoken. If that is closer to why
  you are reading this page than a single morning at Karnak, start a
  conversation instead of a booking.
multiDayCtaLabel: Begin a conversation →
multiDayCtaHref: /private-guide
scarcityBadge: Why we keep it small
scarcityTitle: A handful of private days each week. No more.
scarcityText: >-
  Every guest gets a real concierge and a licensed local team for the day — so
  we cap how many days we take. It keeps the experience unhurried, and it means
  popular dates go early. If your date matters, claim it now.
faq:
  - question: What's included in the price?
    answer: >-
      The whole day, door to door. A private car from your hotel in Hurghada or
      Marsa Alam and back, one concierge who holds every detail, and each site at
      the hour it is quietest. The Signature day adds your own licensed
      Egyptologist, insider access, every entry and tip, meals where locals eat,
      the Signature-only experiences and a signature gift. The Original day
      includes entry to every site you visit, with tips paid locally. The
      Adventure day includes one temple and a Nile sail, with the rest paid
      locally as you go. Each card above shows exactly what its day includes.
  - question: What time is pickup, and how long is the drive?
    answer: >-
      Pickup is flexible: we collect you from your hotel in Hurghada or Marsa Alam
      whenever suits you, up to 24 hours before your day, so you can start fresh
      in Luxor in the morning. The drive takes about four hours from Hurghada and a
      little more from Marsa Alam, at an unhurried pace in a private
      air-conditioned car. The return is just as flexible: we bring you back to
      your hotel door to door whenever suits you, up to 24 hours after your day.
  - question: Is Luxor safe to visit right now?
    answer: >-
      As of November 2026, the UK government excludes Luxor and the Valley of the
      Kings from its warnings about the Western Desert, and doesn't list Hurghada
      or Marsa Alam among the areas it advises against. It also warns that tensions
      in the wider region could change quickly, and that no travel can be guaranteed
      safe, so check your own government's latest advice and make sure your
      insurance covers your trip. On the day you're in a private car with a vetted
      driver, with your concierge one message away. If a safety or security
      situation stops the day going ahead, we'll offer a reschedule or a refund,
      less any non-refundable costs already committed.
  - question: Will we be hassled at the temples?
    answer: >-
      Sellers at Luxor's big sites can be persistent, and we won't pretend
      otherwise. We can't clear a public site of them, but you won't face them
      alone. Your guide or concierge is beside you and deals with anyone who
      approaches, the guards know him, and you visit at the quiet hour, when there's
      far less of it. You won't need to haggle or argue with anyone.
  - question: Who actually guides and drives?
    answer: >-
      Licensed local specialists: vetted drivers and hosts, and a licensed
      Egyptologist at the monuments on the days that include one. The Adventure day
      is led by your concierge, a trusted driver, translator and fixer. We select,
      brief and coordinate everyone, and stay reachable all day.
  - question: Can children come, and what if heat or walking is hard for us?
    answer: >-
      Yes. Children are welcome and count towards the four guests. Tell us their
      ages, and anything that makes heat, steps or long walks hard, when you book:
      your concierge paces the day around it, keeps the car close and plans the
      breaks. Some tombs have steep steps and narrow passages, so he'll suggest the
      ones that suit you.
  - question: What should we wear and bring?
    answer: >-
      Comfortable shoes, light clothes (covered shoulders are respectful at the
      sites), a hat, sunglasses and sunscreen. Bring your passport too: the road
      from the coast has routine police checkpoints. The day runs in English; if
      you'd like another language, ask when you book.
  - question: What about food and dietary needs?
    answer: >-
      On the Signature day a full meal and local food stops are included; the
      Adventure day includes a local food and coffee stop. Tell us about any
      dietary needs or allergies, and your concierge will choose places that suit.
  - question: Are there any hidden costs? What do we pay on the day?
    answer: >-
      You see the price as you build, and what's left to pay depends on the day you
      choose. On the Signature day, every monument ticket, a full meal, local food
      stops and tips are handled, with nothing to carry. On the Original day, every
      entry ticket is in the price and tips are handled; the premium tombs (Nefertari,
      Seti I and Tutankhamun) are added on request. On the Adventure day, one temple
      and a Nile sail are covered; bring local cash for any further tickets,
      experiences and tips.
  - question: How far ahead should we book, and when is our date confirmed?
    answer: >-
      Right now every date is open, from tomorrow onwards. Choose your date,
      reserve with a 50% deposit or pay in full, and we confirm your order within
      24 hours. Booking less than two days ahead? Pay in full to confirm.
  - question: We're more than four, or want several days. Can you do it?
    answer: >-
      Yes. Choose "5 or more" guests or "5+ days" in the builder, and your
      concierge sends a private proposal shaped around your group.
  - question: What if something goes wrong on the day?
    answer: >-
      Message your concierge. A late car, a closed site or a change of heart is his
      to sort out on the spot, and because we pay our partners well, they answer
      when he calls. If a partner truly can't deliver, we'll offer a reschedule or a
      refund, less any non-refundable costs already committed. And if the day isn't
      what we promised, tell him within the first two hours: if we can't put it
      right, we stop there and refund what's left after costs already committed. The
      Cancellation & Refunds page has the full terms.
  - question: What if my plans change?
    answer: >-
      Cancel 7 or more days before and we refund what you've paid, less any
      non-refundable costs already committed, such as tickets and reservations. We
      only book those once your reservation is confirmed, to keep them small. Within
      7 days, payments are non-refundable, but talk to your concierge first: we'll
      do our best to move your date, subject to availability.
  - question: Can I pay part now and part later?
    answer: >-
      Yes. Pay in full online, or place a 50% deposit now to lock your date — the
      balance is charged automatically to the same card the day before, and if
      it can't be taken we email you a secure link. Payments go through Stripe, which
      holds your card details, so we never see or store them.
finalEyebrow: Your date is waiting
finalTitle: Give us one day. We'll give you the one you remember.
finalText: >-
  Private, effortless, and guaranteed — from €330. Pick your date before it's
  taken.
