contrastEyebrow: Why some people leave Egypt disappointed
contrastTitle: You came for the wonder. Not for the noise.
contrastLead: >-
  Some visitors meet Luxor through a packed bus on someone else's clock.
  Twenty rushed minutes per temple. Shoulder to shoulder in the midday heat, and
  a guide they share with forty strangers. A generic script, rushed and
  impersonal. Hours lost to planning, booking, haggling and not knowing who to
  trust.


  The real Egypt — the quiet, the colour, the awe — passes them by. And here is
  the part nobody says out loud: you flew thousands of kilometres to a place
  that has stood sacred for millennia, and you may only stand here once.
badWayItems:
  - A bus with 40 strangers, on someone else's clock
  - Temples hurried, shoulder to shoulder
  - Hours lost to planning, booking, haggling
  - A generic script, rushed and impersonal
  - You hope it's good. You find out on the day.
goodWayItems:
  - Coffee and the sunrise over the Nile, with a car that waits for you
  - Every place at the hour it is genuinely quiet
  - A few crafted experiences, unhurried — room to feel each one
  - Your own licensed Egyptologist, named and booked ahead
  - >-
    One concierge who owns the whole day — and a refund if the first two hours
    don't feel different
  - >-
    A day to mark a life moment: an anniversary, a new chapter, a birthday that
    matters — made into something you keep for a lifetime.
mechanismEyebrow: Why we can actually do this
mechanismTitle: Every site has quiet hours. Almost nobody knows when they are.
mechanismText: >-
  The quiet hour is not simply "early". It moves with the day of the week, the
  season, which cruise boats have just docked, which bus circuit is running
  that morning. Your concierge has spent years watching it move, so he knows
  when each site actually empties. Sometimes that is first light. Sometimes it
  is late afternoon, when the light is better anyway. Occasionally it is the
  middle of the day, when the heat clears a site completely and only a few
  people can take it — and if you are one of them, you get somewhere few people
  reach to yourself.
mechanismNote: >-
  Then he goes further than a schedule: a call ahead to the guards who know him,
  and the Egyptologist you want booked before someone else takes them, not
  whoever is left that morning. And the whole thing is built around when you are
  at your best, not when a tour operator finds it convenient. That is what a
  concierge is for, and it is the difference you are paying for.
dayShapeEyebrow: The feel of it
dayShapeTitle: A day built around you.
dayShapeLead: >-
  Your concierge shapes the day around what you came for, and times each site to
  the hour it empties, until it feels, all day, like Luxor opened for you alone.
dayShapeSteps:
  - time: We start with you, not a route
    label: >-
      Before a single ticket is booked, your concierge asks what actually draws
      you here — the history, the photographs, the stillness, a milestone you're
      marking. Everything after is arranged around that answer.
  - time: The order is chosen for the day
    label: >-
      Which temple you walk into first depends on where it is genuinely empty
      that morning — and that moves with the season and the boats. We sequence the
      day so you are always somewhere quiet, never in the crush.
  - time: One concierge, end to end
    label: >-
      From the moment we collect you at the coast to the drive home, one person
      holds the whole day — the car, the timings, the guards, your Egyptologist.
      You carry nothing, book nothing and arrange nothing.
  - time: You never touch the logistics
    label: >-
      Entries, timing, the private car, the guards, the Egyptologist, all held
      in the background by one person. You experience the day; your concierge
      carries everything underneath it.
dayJourneyShow: false
dayJourneyTitle: How your day flows
dayFlowNotes:
  - h: Anywhere around Luxor, off the beaten track.
    p: >-
      Hidden temples, quiet villages, Nile islands and the open desert. Wherever
      calls to you, your concierge knows the way.
  - h: Coming from Cairo?
    p: We can help you arrange the train or a bus to Luxor.
dayJourney:
  - time: From the day you book
    subtitle: Your concierge on WhatsApp, planning it with you.
    label: >-
      Tell us what draws you to Luxor and when you'd like to go. Your concierge
      shapes the day with you, books every entry and stays one message away,
      before, during and after.
    features:
      - On WhatsApp
      - Planned with you
    image: /images/concierge-day/journey/day-you-book.jpg
  - time: Pickup at your hotel
    subtitle: Hurghada or Marsa Alam, up to 24 h before your day.
    label: >-
      Choose your time. Set off at dawn, or come the evening before so you wake
      up fresh in Luxor, with the morning over the Nile.
    features:
      - Up to 24 h before
      - Hurghada · Marsa Alam
      - From your hotel
    image: /images/concierge-day/journey/pickup-red-sea-sunrise-hd.jpg
  - time: The road to Luxor
    subtitle: About 4 hours by private car, at an unhurried pace.
    label: >-
      A private, air-conditioned car through the mountains and the desert, with
      a stop whenever you like. Sleep, take photos, or plan the day with your
      concierge.
    features:
      - About 4 h drive
      - Private car
    image: /images/concierge-day/journey/road-to-luxor-hd.jpg
  - time: Temples and tombs
    subtitle: At your pace, each one at its quietest hour.
    label: >-
      Your concierge sets the order on the day, so you walk into each temple and
      tomb when it is emptiest. On the Signature day, your Egyptologist reads
      the walls with you.
    features:
      - At your pace
      - Quietest hour
    image: /images/concierge-day/journey/temples-and-tombs-hd.jpg
  - time: An unhurried day
    subtitle: Food stops, a slow afternoon or the desert. Just ask.
    label: >-
      Stop to eat where locals eat, keep the middle of the day open and slow, or
      venture out into the desert. Anything you'd like, just tell your concierge.
    features:
      - Local food stops
      - Anything you ask
    image: /images/concierge-day/journey/unhurried-balcony-sunrise.jpg
  - time: Golden hour
    subtitle: A felucca on the Nile, or sunset in the dunes.
    label: >-
      End the day as the light turns gold: a private felucca on the river, or a
      quiet spot in the desert as the sun goes down.
    features:
      - Golden hour
      - Felucca or desert
    image: /images/concierge-day/journey/golden-hour-hd.jpg
  - time: Home, door to door
    subtitle: Back to your hotel, up to 24 h after your day.
    label: >-
      Head back the same night, or stay over and leave the next day. The car
      takes you to your hotel door, whenever suits you.
    features:
      - Up to 24 h after
      - Door to door
    image: /images/concierge-day/journey/home-hd.jpg
  - time: Stay longer
    subtitle: More days, more of Luxor, at a better price per day.
    label: >-
      Add days to see more of Luxor at a slower pace. The longer you stay, the
      lower the price per day.
    features:
      - More days
      - Better value
    image: /images/concierge-day/journey/stay-longer-hd.jpg
dreamEyebrow: More than a trip
dreamTitle: What your Luxor Rising day can hold
dreamText: >-
  For many who come it becomes more than a trip: a homecoming, a quiet place to
  set a new direction, a way to mark an anniversary, a new chapter made into
  something you keep for a lifetime. These are the days we make for our guests.
  And if the first two hours don't feel different, we refund the rest.
