contrastEyebrow: Why most people leave Egypt disappointed
contrastTitle: You came for the wonder. Not for a queue.
contrastLead: >-
  Most visitors meet Luxor through a packed coach, twenty rushed minutes per
  temple, the midday heat, and a guide they share with forty strangers. The real
  Egypt — the quiet, the colour, the awe — passes them by. And here is the part
  nobody says out loud: you flew four thousand kilometres to a place that has
  stood for three and a half thousand years, and you will probably stand here
  once. That is the whole argument for doing it properly.
badWayItems:
  - A coach with 40 strangers, on someone else's clock
  - Temples at midday, shoulder to shoulder
  - Hours lost to planning, booking, haggling
  - A generic script, rushed and impersonal
  - You hope it's good. You find out on the day.
goodWayItems:
  - Coffee, the sunrise over the Nile, and a car that waits for you
  - Each place at the hour it is actually quiet — which is rarely the obvious one
  - Three places, unhurried — not seven, ticked off
  - Your licensed Egyptologist, named and booked before someone else takes them
  - One consigliere who owns the whole day — and a refund if the first two hours
    don't feel different
mechanismEyebrow: Why we can actually do this
mechanismTitle: Every site has quiet hours. Almost nobody knows when they are.
mechanismText: >-
  The quiet hour is not simply "early". It moves — with the day of the week, the
  season, which cruise boats have just docked, which coach circuit is running
  that morning. Ahmed has spent years watching it move, so he knows when each
  site actually empties. Sometimes that is first light. Sometimes it is late
  afternoon, when the light is better anyway. Occasionally it is the middle of
  the day, when the heat clears a site completely and only a few people can take
  it — and if you are one of them, you get somewhere extraordinary to yourself.
mechanismNote: >-
  Then he goes further than a schedule: a call ahead to the guards who know him,
  and the Egyptologist you want booked before someone else takes them — not
  whoever is left that morning. And the whole thing is built around when you are
  at your best, not when a tour operator finds it convenient. That is what a
  consigliere is for, and it is the difference you are paying for.
dayShapeEyebrow: The feel of it
dayShapeTitle: Not a schedule. A day with room in it.
dayShapeSteps:
  - time: How it starts
    label: >-
      Coffee in your hand and the first light coming up over the Nile. Nobody
      hurries you. The car is already waiting for whenever you are ready.
  - time: The quiet hour
    label: >-
      You walk into the temple your consigliere chose for that particular day —
      and there is almost nobody in it. Your Egyptologist reads the walls, then
      knows when to stop talking.
  - time: The long middle
    label: >-
      Nothing. Deliberately. A long breakfast, shade, the river — while everyone
      else is queueing in the heat.
  - time: When the light turns
    label: >-
      Back out as the colour comes into the stone, to a second place that is
      quiet at exactly that hour.
  - time: How it ends
    label: >-
      The Nile, unhurried, because the river is always best last.
dayShapeNote: >-
  Three places in a day, not seven. You will be offered fewer things than anyone
  else in Luxor will offer you — that is the product. The empty hours in the
  middle are not a gap in the plan. They are the plan.
dreamText: >-
  You wake before the heat. A private car is already waiting. At Karnak, the
  great hall is almost empty — your Egyptologist unfolds three thousand years as
  the first light moves between the columns. Lunch is handled. By late afternoon
  the Nile is yours alone, a felucca tilting into the gold. You took no
  decisions, stood in no queue, missed nothing. You simply arrived — and Egypt
  did the rest.
