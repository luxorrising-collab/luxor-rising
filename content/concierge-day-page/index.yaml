thresholdEyebrow: If you're standing at a threshold
thresholdTitle: Some people come for Egypt. Some come for the pause before what's next.
thresholdText: >-
  We arrange a lot of these days for people between two chapters — a company
  sold, a decision not yet made, a birthday that landed harder than expected. We
  don't promise anything about that. A day can't fix a life. What it can do is
  give you an early hour in a place built three thousand years ago by people who
  were also trying to make something last, no schedule to keep, and someone
  beside you who knows when not to talk. Most of the value is in the silence we
  deliberately leave in the middle of the day.
multiDayEyebrow: If one day isn't the question
multiDayTitle: Some people aren't booking a day. They're booking a week to decide something.
multiDayText: >-
  The Return is seven days, written for one person, and we don't publish the
  itinerary because there isn't one until we've spoken. If that is closer to why
  you are reading this page than a single morning at Karnak, start a
  conversation instead of a booking.
multiDayCtaLabel: Begin a conversation →
multiDayCtaHref: /private-guide
scarcityBadge: Why we keep it small
scarcityTitle: A handful of private days each week. No more.
scarcityText: >-
  Every guest gets a real consigliere and a licensed local team for the day — so
  we cap how many days we take. It keeps the experience flawless, and it means
  popular dates go early. If your date matters, claim it now.
faq:
  - question: How do you actually get the temples empty?
    answer: >-
      Every site has quiet hours — but they move, with the day of the week, the
      season, and which cruise boats have just docked. Ahmed has spent years
      watching that pattern, so he knows when each place actually empties.
      Sometimes it's first light; sometimes late afternoon, when the light is
      better anyway; occasionally the middle of the day, when the heat clears a
      site completely. Then he goes further than any schedule: a word with the
      guards who know him, and your Egyptologist booked before someone else
      takes them — not whoever is left that morning.
  - question: Is this really worth it over a cheap group tour?
    answer: >-
      A group tour saves a little money and costs you the experience — crowds,
      rushing, and a day you don't control. We give you the temples before the
      crowds, your own expert, and zero decisions. Most guests tell us it was
      the best day of their trip. That's what you're paying for.
  - question: Why does this cost more than a tour?
    answer: >-
      Two reasons, and neither is a markup. The first is the hour — being inside
      at 6:15 instead of 9:30 costs a private car, pre-bought tickets and people
      on the ground who can do it. The second is that we pay our Egyptologists
      roughly three times the going day rate in Luxor. That isn't charity: it's
      how we get the ones who still love the material, instead of the ones
      reciting the same script for the fourth time that day.
  - question: Are you a travel agency?
    answer: >-
      No. We're your private concierge and advisor. We arrange and coordinate
      your day; the experiences, guiding and transfers are delivered by our
      licensed local partners. Each day is a single day with no overnight.
  - question: Can I pay part on the day?
    answer: >-
      Yes. Pay in full online, or place a deposit now to lock your date and
      settle the rest on the day with your concierge.
  - question: What if my plans change?
    answer: >-
      Cancel up to 7 days before for a full refund, no questions asked. Closer
      to the day, talk to your consigliere — we'll do everything we can to move
      it.
  - question: Who actually guides and drives?
    answer: >-
      Licensed local specialists — a licensed Egyptologist for the monuments,
      vetted drivers and hosts. We select, brief and coordinate them, and stay
      reachable all day.
  - question: What if I want more than one day?
    answer: >-
      Add days in the configurator — the per-day price drops and extra
      signatures and bonuses unlock (Medinet Habu, a private photoshoot, a
      welcome gift and more). Each day stays a single day; we never bundle an
      overnight.
finalEyebrow: Your date is waiting
