sistrum:
  name: The Sistrum
  hand: A small instrument of metal — held, and gently shaken
  meaning: >-
    Its sound has been used for thousands of years to still the mind and clear a
    space. A soft, feminine current: receptivity, intuition, the grace of
    letting life move through you — a way to return to that stillness, anywhere.
  tags:
    - Received energy
    - Hand-picked
    - Locally made
sceptre:
  name: The Sceptre
  hand: Of stone or metal — the mark of one who holds their own authority
  meaning: >-
    The looped cross it bears is a sign of life that endures — breath,
    continuity, the part of you that does not end. A strong, masculine current:
    will, direction, standing in your own power without force.
  tags:
    - Inner authority
    - Hand-picked
    - Locally made
crown:
  name: The Crown
  hand: A simple band of metal, chosen with a scarf for the occasion
  meaning: >-
    Light enough to wear, meant to be kept. Worn, or held in stillness or on
    special occasions, its small weight settles the body and quiets the nervous
    system, drawing you back to a calm, grounded sense of your own inner
    authority and presence.
  tags:
    - Mastery & presence
    - Hand-picked
    - Locally made
