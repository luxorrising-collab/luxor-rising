sistrum:
  name: The Sistrum
  hand: A small instrument of metal — held, and gently shaken
  meaning: >-
    Its sound has been used for thousands of years to still the mind and clear a
    space. To settle what is heavy and call in what is good. It carries a soft,
    feminine current: receptivity, intuition, the grace of letting life move
    through you. A way to return to that stillness, anywhere.
  tags:
    - Received energy
    - Hand-picked
    - Locally made
sceptre:
  name: The Sceptre
  hand: Of stone or metal — the mark of one who holds their inner authority
  meaning: >-
    In the oldest tradition, a sceptre in the right hand belonged to those who
    ruled themselves first. The looped cross it bears is a sign of life that
    endures. Breath, continuity, the part of you that does not end. A strong,
    masculine current: will, direction, standing in your own power without force.
  tags:
    - Inner authority
    - Hand-picked
    - Locally made
crown:
  name: The Crown
  hand: A simple band of metal, chosen with a scarf for you and the occasion
  meaning: >-
    Light enough to wear, meant to be kept. A crown has always said one thing:
    remember who you are. Worn, or held in stillness, its small weight settles
    the body and quiets the nervous system drawing you back to a calm, grounded
    sense of inner mastery and presence.
  tags:
    - Mastery & presence
    - Hand-picked
    - Locally made
