howItWorksEyebrow: How it works
howItWorksTitle: You choose a date. We arrange everything.
howItWorksSteps:
  - title: Reserve in a minute
    description: Pick your date, who's coming, and the hour. Pay securely online.
  - title: You get a name, not a voucher
    description: >-
      Within 24 hours you'll know who is meeting you: your Egyptologist,
      [[MENO]], licensed by the Ministry of Tourism & Antiquities (licence
      [[ČÍSLO]]), and Ahmed, who runs the day on the ground and has been
      arranging private mornings in Luxor for [[POČET]] years. Not a guide
      assigned to you on the morning.
  - title: You just enjoy the flow
    description: >-
      Nothing to organise, decide or carry. You arrive — and three
      thousand years unfold around you.
disclosureText: >-
  Luxor Rising is your private concierge & advisor. We arrange and
  coordinate; transfers, hosting and — at the monuments — guiding by a
  certified Egyptologist are delivered by our licensed local partners. This
  is a single daytime experience with no overnight stay.
consigliereEyebrow: The person at the heart of it
consigliereTitle: What is a Luxor Rising concierge?
consigliereLead: >-
  Not a guide with a flag and a script. A concierge is one trusted person who
  understands where you are in your own journey, shares the road with you, and
  quietly arranges every last detail — the car, the tickets, the right hour, the
  doors — so all you have to do is be present. You manage nothing. You just flow.
consigliereImage: /images/hosts/ahmed-nile-sunset.jpg
consiglierePoints:
  - title: A guide who understands your journey
    description: >-
      Someone who listens first — who grasps what this trip really means to you —
      and then reads three thousand years in a way that speaks to it. Never a
      memorised tour repeated to everyone.
  - title: A companion who shares the road
    description: >-
      A real person who knows your name, is on WhatsApp before you arrive and
      beside you through every day. Someone — never a call centre or a voucher.
  - title: Everything arranged, so you just flow
    description: >-
      Cars, tickets, timing, translation, the quiet hour ahead of the crowds, and
      the doors that never open for a coach — all handled invisibly. You never
      touch a single logistic.
guaranteeEyebrow: Our promise
guaranteeTitle: Reserved with confidence — or we make it right.
guaranteeItems:
  - title: Cancel freely
    description: >-
      Plans change. Cancel up to 7 days before for a full refund, no fine
      print.
  - title: Pay your way
    description: >-
      Settle in full, or place a deposit now and the balance is charged
      automatically the day before. Your spot is held either way.
  - title: The first hour is on us if we're wrong
    description: >-
      If the first hour doesn't feel different from any tour you've been on
      before, say so and it's on us. Tell your concierge on the day — no
      form, no argument, refunded in full.
