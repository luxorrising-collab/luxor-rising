howItWorksEyebrow: How it works
howItWorksTitle: You choose a date. We arrange everything.
howItWorksSteps:
  - title: Reserve in a minute
    description: Pick your date, who's coming, and the hour. Pay securely online.
  - title: You get a name, not a voucher
    description: >-
      Within 24 hours you'll know who is meeting you: your Egyptologist,
      [[MENO]], licensed by the Ministry of Tourism & Antiquities (licence
      [[ČÍSLO]]), and Ahmed, who runs the day on the ground and has been
      arranging private mornings in Luxor for [[POČET]] years. Not a guide
      assigned to you on the morning.
  - title: You just enjoy the flow
    description: >-
      Nothing to organise, decide or carry. You arrive — and three
      thousand years unfold around you.
disclosureText: >-
  Luxor Rising is your private concierge & advisor. We arrange and
  coordinate; transfers, hosting and — at the monuments — guiding by a
  certified Egyptologist are delivered by our licensed local partners. This
  is a single daytime experience with no overnight stay.
consigliereEyebrow: The person this actually depends on
consigliereTitle: What a consigliere is — and why it changes the day.
consigliereLead: >-
  Not a guide with a flag, and not a call centre. A consigliere is one person who
  has spent a lifetime around these temples, knows how they breathe at different
  hours, and has enough feel for the place to accompany you through your own
  version of it — not a script repeated to everyone.
consigliereImage: /images/hosts/ahmed-nile-sunset.jpg
consiglierePoints:
  - title: A lifetime around these stones
    description: >-
      He grew up in their shadow. He knows which court holds the light longest,
      which corner is cool at noon, and what is worth walking past — the kind of
      understanding you cannot read up on before a shift.
  - title: Friendships that open doors
    description: >-
      Decades of relationships in this city, built long before you arrived.
      That's what makes a closed gate open, and a "no" become "for you, yes".
  - title: A word with the guards
    description: >-
      He speaks to the men who keep these temples, so you are welcomed rather
      than watched — and nobody trails you hoping for something.
  - title: Tips, police and paperwork — handled
    description: >-
      The small frictions that quietly exhaust people in Egypt are dealt with
      before you notice them. No cash produced at gates, no negotiations, no
      being pulled aside. You just flow.
  - title: He drives you himself
    description: >-
      So there is no handover, no stranger at the wheel, and no moment where
      nobody is quite in charge. One person owns the whole day.
  - title: Your journey, not the standard one
    description: >-
      He listens first. Two people can book the same temple and want completely
      different things from it — the shape of your day follows yours.
guaranteeEyebrow: Our promise
guaranteeTitle: Reserved with confidence — or we make it right.
guaranteeItems:
  - title: Cancel freely
    description: >-
      Plans change. Cancel up to 7 days before for a full refund, no fine
      print.
  - title: Pay your way
    description: >-
      Settle in full, or place a deposit and pay the rest on the day.
      Your spot is held either way.
  - title: The first hour is on us if we're wrong
    description: >-
      If the first hour doesn't feel different from any tour you've been on
      before, say so and it's on us. Tell your consigliere on the day — no
      form, no argument, refunded in full.
testimonialsEyebrow: From recent guests
testimonialsTitle: The temple they didn't expect to love most.
# SAMPLE reviews below, so the section can be previewed. reviewsVerified stays
# false → they render with a visible "sample" note and emit NO star-rating
# structured data to Google. Replace with real, attributable guest reviews and
# only then set reviewsVerified: true.
reviewsVerified: false
testimonials:
  - quote: >-
      We've done the big-bus version of Egypt before. This wasn't that. We had
      Medinet Habu almost to ourselves for the first hour, coffee in hand, and
      Ahmed knew exactly which wall to stand us in front of as the light came up.
      I didn't want to leave.
    author: Lena & Tomáš, Vienna
    rating: 5
    date: "2026-03-14"
  - quote: >-
      What sold us afterwards was everything we never had to think about — no
      tickets, no tipping at gates, no wondering if we were being overcharged.
      Someone we trusted just handled the whole day. The photos he took on my own
      phone are the ones now framed at home.
    author: Priya R., London
    rating: 5
    date: "2026-02-02"
  - quote: >-
      I was worried it would feel like a rushed history lesson. It was the
      opposite — unhurried, personal, and our Egyptologist answered questions for
      as long as we had them. Worth every euro, and I'm not someone who says that
      lightly.
    author: Michael D., Toronto
    rating: 5
    date: "2026-01-19"
