quote: >-
  My guide was absolutely incredible! From the very beginning of the trip, he
  went above and beyond to make sure I was comfortable, happy and well looked
  after. He showed me places and experiences I would never have discovered on my
  own, opening my eyes to so much and sharing his wealth of knowledge every step
  of the way. From picking me up in his car and taking me to our destination, to
  making sure every little detail was taken care of, his kindness, thoughtfulness
  and genuine passion made the whole experience so special. He consistently went
  the extra mile to ensure I had an unforgettable and unique experience. I
  honestly couldn't have asked for a better guide and I'm already looking forward
  to our next adventure together in Egypt.
