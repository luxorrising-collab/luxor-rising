author: Man of Knowledge
location: ""
quote: >-
  Luxor Rising arranged almost a month in Egypt for me from start to finish, and
  4 days in Luxor, and every part of it was handled beautifully so I could simply
  be present and enjoy my trip. I was met at Hurghada airport at 1 a.m. — Ahmed
  waited for me patiently, welcomed me warmly, and made me feel at home from the
  very first moment: he helped me with the practical errands, and a beautiful
  apartment was ready and perfect for a stay of over two weeks. Every transfer,
  including the drive from Hurghada to Luxor and the safe run back to the airport
  at the end, was on time and effortless. My private guide-concierge, Ahmed, has
  lived in Luxor his whole life and knows it deeply; he speaks about the place
  with real love, and it's contagious. The whole trip was arranged end to end and
  felt tranquil and powerful. We kept to two or three experiences a day, at an
  unhurried pace, so each could be given the reverence and full presence it
  deserves. Medinet Habu at dawn — my first temple, which I left to Ahmed to
  choose, and he chose perfectly; I absolutely loved it, and it was one of the
  most powerful hours of my life. The scale of Karnak and Luxor Temple is
  amazing; I felt deep silence and peace there. The most moving chambers aren't
  the most photographed ones, but the ones more hidden. The second day ended with
  sailing the Nile at sunset; I don't remember ever feeling so light. In the
  mornings I watched the balloons rise over the Valley of the Kings and the sun
  climb over the river from the West Bank — I've never found a better place for a
  morning coffee. And so much more. I am so grateful for being able to share
  those beautiful moments with Ahmed. He always arrived right on time, and each
  day flowed naturally and easily, like travelling with an old friend. He
  introduced me to his friends and handled everything with the guards and
  officials so there was never any friction, answering every request quickly. The
  city of Luxor hums with calls to prayer, the Nile drifts by peacefully, and I
  felt so good and happy there. Almost a year later, the feeling hasn't left me.
  Luxor quietly changed the direction of my life. It left me with a new, powerful
  vision and feeling that is integrated in me forever. If you want Luxor and the
  Nile done privately, unhurried and beautifully, from the airport to the last
  temple, I can't recommend Luxor Rising enough.
pullQuote: Luxor quietly changed the direction of my life.
