quote: >-
  Luxor Rising arranged my whole trip in Egypt end to end, and it was flawless. I
  was met at the airport late at night and made to feel at home from the very
  first moment; a beautiful apartment was ready for my stay, and every transfer
  was safe and right on time. My private guide, Ahmed, has lived in Luxor his
  whole life and knows it deeply — he took care of every last detail so I could
  simply enjoy it. We kept to two experiences a day, unhurried, so each could be
  met with the reverence it deserves: Medinet Habu at dawn, the sheer scale of
  Karnak and Luxor Temple, sailing the Nile at sunset, and watching the balloons
  rise over the Valley of the Kings from the West Bank at first light. Everything
  felt tranquil and powerful at once. Every request was handled quickly and
  calmly, and Ahmed is wonderful with the local people, so there was never any
  friction — I could just be present. A private, concierge-led way to experience
  Luxor and the Nile that I can't recommend enough.
